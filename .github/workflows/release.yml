name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.8
          install_args: hk pkl
          cache: false

      - run: scripts/validate-presets.sh

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}" pkl project package --output-path .out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          gh release create "$TAG" --verify-tag --generate-notes \
            ".out/hk-config@${version}" ".out/hk-config@${version}.zip"
